{% set version = "1.7.2" %}
{% set name = "nest-asyncio2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1921d70b92cc4612c374928d081552efb59b83d91b2b789d935c665fa01729a8

build:
  skip: true  # [py<35]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools >=42
    - setuptools-scm >=3.4.3
    - wheel
    - pip
  run:
    - python

test:
  imports:
    - nest_asyncio2
  source_files:
    - tests
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest tests -v

about:
  home: https://github.com/Chaoses-Ib/nest-asyncio2
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Patch asyncio to allow nested event loops
  description: |
    By design asyncio does not allow its event loop to be nested. This presents a practical problem:
    When in an environment where the event loop is already running it's impossible to run tasks and wait for the result.
    Trying to do so will give the error "RuntimeError: This event loop is already running".
    The issue pops up in various environments, such as web servers, GUI applications and in Jupyter notebooks.
    This module patches asyncio to allow nested use of asyncio.run and loop.run_until_complete.
  doc_url: https://github.com/Chaoses-Ib/nest-asyncio2/blob/master/README.md
  dev_url: https://github.com/Chaoses-Ib/nest-asyncio2

extra:
  recipe-maintainers:
    - claudiushaag